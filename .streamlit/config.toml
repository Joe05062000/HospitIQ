[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "light"
primaryColor = "#176F9B"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17324D"
borderColor = "#DCE7EF"
linkColor = "#176F9B"
linkUnderline = true
showSidebarBorder = true
showWidgetBorder = true
font = "sans-serif"
baseFontSize = 16
baseRadius = "0.75rem"
headingFontSizes = ["2.45rem", "1.65rem", "1.2rem"]
headingFontWeights = [700, 650, 650]
paddingTop = "2.75rem"
paddingBottom = "3rem"
chartCategoricalColors = ["#176F9B", "#0D9488", "#66B4CE"]

[theme.sidebar]
primaryColor = "#176F9B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#E3F4FB"
textColor = "#17324D"
borderColor = "#DCE7EF"
linkColor = "#176F9B"
